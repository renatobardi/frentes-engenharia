{% extends "base.html" %}
{% block titulo %}Relatar uma frente · frentes-engenharia{% endblock %}
{% block conteudo %}
<link rel="stylesheet" href="/static/relato.css">
<script>
  // o servidor responde 422 com a gaveta e a mensagem de erro: o HTMX troca mesmo assim
  document.addEventListener("htmx:beforeSwap", function (e) {
    if (e.detail.xhr.status === 422) { e.detail.shouldSwap = true; e.detail.isError = false; }
  });
</script>
{% include "relato/gaveta.html" %}
{% endblock %}
