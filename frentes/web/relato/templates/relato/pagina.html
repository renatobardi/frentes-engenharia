{% extends "base.html" %}
{% block titulo %}Relatar uma frente · frentes-engenharia{% endblock %}
{% block conteudo %}
<link rel="stylesheet" href="/static/relato.css">
<script>
  // o servidor responde 422 com a gaveta em HTML e a mensagem de erro: só então o HTMX troca
  document.addEventListener("htmx:beforeSwap", function (e) {
    var tipo = e.detail.xhr.getResponseHeader("Content-Type") || "";
    if (e.detail.xhr.status === 422 && tipo.indexOf("text/html") === 0) { e.detail.shouldSwap = true; e.detail.isError = false; }
  });
</script>
{% include "relato/gaveta.html" %}
{% endblock %}
