# Limiares e cortes aplicados sobre a resposta guardada do Jev.
# Ficam fora da versão da taxonomia: mudar um valor aqui recalcula as colunas
# finais da classificação sem chamar o Jev de novo. Segredo nunca entra aqui.
# A cópia usada na gravação do snapshot vai para snapshot_meta.limiares.

# Confiança mínima por dimensão (#6, #11). Abaixo dela: área, tipo e natureza
# vão ao desempate da LLM; causa raiz vira "causa incerta"; problema fica sem valor.
[confianca]
area = 0.5
tipo = 0.5
natureza = 0.5
causa_raiz = 0.3
problema = 0.5

# Pergunta de controle (#14): abaixo do corte a frente é incerta por texto vago.
[controle]
texto_vago = 0.5

# Encaixe fraco (#9): "Nenhum destes" no tipo ou confiança do tipo abaixo deste valor,
# contado antes do desempate da LLM.
[encaixe_fraco]
confianca_tipo = 0.7

# Sinal de encaixe (#9): gatilhos da revisão da taxonomia, em fração das frentes.
[sinal_de_encaixe]
encaixe_fraco = 0.12
janela_dias = 30
minimo_frentes = 100
nao_classificadas = 0.05
incertas = 0.15
maior_tipo = 0.45

# Revisão (#9): operação com menos frentes de evidência é descartada.
[revisao]
evidencia_minima = 5

# Problema recorrente (#8): frentes em pelo menos este número de dias distintos.
[recorrencia]
dias_distintos = 3

# Selo "urgente". PROVISÓRIO: as resoluções deixaram o valor para a construção (#3).
[urgencia]
selo = 0.7
