[project]
name = "eventos"
version = "0.1.0"
description = "PoC que classifica eventos e mostra num mapa de calor onde investir"
readme = "README.md"
requires-python = ">=3.12,<3.13"
# Dependências de execução: só estas (ADR-0001). Sem ORM, sem SDK de LLM.
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "jinja2>=3.1",
    "httpx>=0.27",
    "python-multipart>=0.0.9",
    "psycopg[binary]>=3.2",
    "psycopg-pool>=3.2",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[tool.uv]
# Não é distribuído: roda da raiz do repo com `python -m eventos`.
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
# tests/ espelha eventos/ sem __init__.py: nomes de arquivo podem se repetir entre pastas.
addopts = "--import-mode=importlib"
filterwarnings = [
    "error",
    # O TestClient do Starlette pede httpx2; a dependência decidida no ADR-0001 é httpx.
    "ignore:Using `httpx` with `starlette.testclient` is deprecated",
    # Um teste que abre o banco e não fecha: o psycopg avisa na coleta da conexão. O conftest
    # derruba as conexões esquecidas ao fim do teste, então o aviso não diz nada de útil.
    "ignore:.*was deleted while still open:ResourceWarning",
    "ignore:.*BaseConnection.__del__.*:pytest.PytestUnraisableExceptionWarning",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "TID251"]

# Regras de dependência entre módulos (AGENTS.md). Quem pode usar cada API está em per-file-ignores.
[tool.ruff.lint.flake8-tidy-imports.banned-api]
"sqlite3".msg = "O banco é Postgres (ADR-0002): nada de sqlite3."
"psycopg".msg = "Só eventos/store/ tem SQL."
"httpx".msg = "Só eventos/jev/ e eventos/llm/ falam com a rede."
"urllib.request".msg = "Só eventos/jev/, eventos/llm/ e a rajada falam com a rede."
"socket".msg = "Só eventos/jev/ e eventos/llm/ falam com a rede."
"os.environ".msg = "Só eventos/config.py lê o ambiente."
"os.getenv".msg = "Só eventos/config.py lê o ambiente."

[tool.ruff.lint.per-file-ignores]
"eventos/config.py" = ["TID251"]
"eventos/store/**" = ["TID251"]
"eventos/jev/**" = ["TID251"]
"eventos/llm/**" = ["TID251"]
"eventos/seed/rajada.py" = ["TID251"]
# só captura os erros do driver na carga do snapshot (sem SQL)
"eventos/snapshot/arquivo.py" = ["TID251"]
"tests/**" = ["TID251"]
