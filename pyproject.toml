[project]
name = "frentes"
version = "0.1.0"
description = "PoC que classifica frentes e mostra num mapa de calor onde investir"
readme = "README.md"
requires-python = ">=3.12,<3.13"
# Dependências de execução: só estas (ADR-0001). Sem ORM, sem SDK de LLM.
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "jinja2>=3.1",
    "httpx>=0.27",
    "python-multipart>=0.0.9",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[tool.uv]
# Não é distribuído: roda da raiz do repo com `python -m frentes`.
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
# tests/ espelha frentes/ sem __init__.py: nomes de arquivo podem se repetir entre pastas.
addopts = "--import-mode=importlib"
filterwarnings = [
    "error",
    # O TestClient do Starlette pede httpx2; a dependência decidida no ADR-0001 é httpx.
    "ignore:Using `httpx` with `starlette.testclient` is deprecated",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "TID251"]

# Regras de dependência entre módulos (AGENTS.md). Quem pode usar cada API está em per-file-ignores.
[tool.ruff.lint.flake8-tidy-imports.banned-api]
"sqlite3".msg = "Só frentes/store/ tem SQL."
"httpx".msg = "Só frentes/jev/ e frentes/llm/ falam com a rede."
"urllib.request".msg = "Só frentes/jev/, frentes/llm/ e a rajada falam com a rede."
"socket".msg = "Só frentes/jev/ e frentes/llm/ falam com a rede."
"os.environ".msg = "Só frentes/config.py lê o ambiente."
"os.getenv".msg = "Só frentes/config.py lê o ambiente."

[tool.ruff.lint.per-file-ignores]
"frentes/config.py" = ["TID251"]
"frentes/store/**" = ["TID251"]
"frentes/jev/**" = ["TID251"]
"frentes/llm/**" = ["TID251"]
"frentes/seed/rajada.py" = ["TID251"]
"tests/**" = ["TID251"]
