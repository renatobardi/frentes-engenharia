# Um serviço. O mesmo arquivo sobe no LXC do oute-server e no Mac (reserva sem rede).
# O banco é o Postgres do oute-supabase-db (ADR-0002): em produção, EVENTOS_DATABASE_URL vem do .env.
services:
  app:
    build:
      context: .
      args:
        EVENTOS_COMMIT: ${EVENTOS_COMMIT:-desconhecido}
    # Os segredos e a URL do banco vêm do .env (root, 0600, fora do git). Sem as chaves a aplicação
    # sobe: as telas funcionam do snapshot e o evento novo fica aguardando classificação.
    # EVENTOS_DATABASE_URL leva a senha da role do app (do cofre).
    env_file:
      - path: .env
        required: false
    environment:
      EVENTOS_HOST: 0.0.0.0
      EVENTOS_PORT: "8000"
    # Só a própria máquina por padrão. No LXC, EVENTOS_PUBLICAR leva o IP e a porta alocados.
    ports:
      - "${EVENTOS_PUBLICAR:-127.0.0.1:8000}:8000"
    restart: unless-stopped

  # Só desenvolvimento e testes: `docker compose --profile dev up -d db` (ou `make db`).
  # Em produção o banco é o do oute-supabase-db, nunca este.
  db:
    profiles: [dev]
    image: postgres:17-alpine
    environment:
      POSTGRES_PASSWORD: teste
    ports:
      - "127.0.0.1:55439:5432"
